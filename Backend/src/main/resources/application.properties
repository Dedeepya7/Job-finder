spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed directly in PostgreSQL (psql). Hibernate must NOT create/alter tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}